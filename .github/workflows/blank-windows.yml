name: Blank Launcher for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blank-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: swatinem/rust-cache@v2
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
        run: |
          cargo test --release --locked -p riven-launch --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked
      - name: Package and smoke-test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'riven').version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid launcher version: $version" }
          "BLANK_VERSION=$version" >> $env:GITHUB_ENV
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$version" blank-setup.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testDir = Join-Path $env:RUNNER_TEMP 'Blank Launcher test install'
          $setup = (Resolve-Path Blank-Setup.exe).Path
          $installed = Start-Process -FilePath $setup -ArgumentList "/S /D=$testDir" -WindowStyle Hidden -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer returned $($installed.ExitCode)" }
          $actual = (Get-FileHash -LiteralPath "$testDir/riven.exe").Hash
          if ($actual -ne (Get-FileHash target/release/riven.exe).Hash) { throw 'Installed binary hash mismatch' }
          Copy-Item -LiteralPath Blank-Setup.exe -Destination Riven-Setup-x86_64.exe
          Compress-Archive -LiteralPath target/release/riven.exe -DestinationPath riven-x86_64-windows.zip
          Copy-Item -LiteralPath riven-x86_64-windows.zip -Destination Blank-Portable.zip
      - name: Publish Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$BLANK_VERSION"
          gh release create "$tag" Blank-Setup.exe Blank-Portable.zip Riven-Setup-x86_64.exe riven-x86_64-windows.zip --target "$GITHUB_SHA" --latest --title "Blank Launcher $BLANK_VERSION" --notes-file LAUNCHER-RELEASE.md
